<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umrah Guide</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      text-align: center;
    }

    header {
      background: #176b4d;
      color: white;
      padding: 25px 10px;
    }

    h1 {
      margin: 0;
    }

    .container {
      padding: 20px;
    }

    .card {
      background: white;
      margin: 15px auto;
      padding: 20px;
      max-width: 500px;
      border-radius: 15px;
      box-shadow: 0 2px 8px #ccc;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 7px 0;
      border: none;
      border-radius: 10px;
      background: #176b4d;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .counter {
      font-size: 55px;
      font-weight: bold;
      color: #176b4d;
      margin: 15px;
    }

    .small {
      font-size: 14px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>🕋 عمرہ گائیڈ</h1>
  <p>آپ کے عمرہ کے سفر کا آسان ساتھی</p>
</header>

<div class="container">

  <div class="card">
    <h2>عمرہ کے مراحل</h2>

    <button>1. احرام اور نیت</button>
    <button>2. تلبیہ</button>
    <button>3. طواف</button>
    <button>4. دو رکعت نماز</button>
    <button>5. زمزم</button>
    <button>6. سعی</button>
    <button>7. حلق یا قصر</button>
  </div>

  <div class="card">
    <h2>طواف کاؤنٹر</h2>

    <div id="tawaf" class="counter">0</div>

    <button onclick="addTawaf()">چکر مکمل +1</button>
    <button onclick="resetTawaf()">Reset</button>

    <p class="small">طواف کے کل 7 چکر</p>
  </div>

  <div class="card">
    <h2>سعی کاؤنٹر</h2>

    <div id="sai" class="counter">0</div>

    <button onclick="addSai()">چکر مکمل +1</button>
    <button onclick="resetSai()">Reset</button>

    <p class="small">صفا اور مروہ کے درمیان 7 چکر</p>
  </div>

  <div class="card">
    <h2>اہم دعائیں</h2>
    <button>تلبیہ</button>
    <button>طواف کی دعائیں</button>
    <button>صفا و مروہ کی دعا</button>
    <button>عام دعائیں</button>
  </div>

</div>

<script>
let tawaf = 0;
let sai = 0;

function addTawaf() {
  if (tawaf < 7) {
    tawaf++;
    document.getElementById("tawaf").innerText = tawaf;
  }
}

function resetTawaf() {
  tawaf = 0;
  document.getElementById("tawaf").innerText = tawaf;
}

function addSai() {
  if (sai < 7) {
    sai++;
    document.getElementById("sai").innerText = sai;
  }
}

function resetSai() {
  sai = 0;
  document.getElementById("sai").innerText = sai;
}
</script>

</body>
</html>
